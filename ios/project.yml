# iOS-udgaven af MC-app. Genereres til et Xcode-projekt med:  cd ios && xcodegen
name: MCApp
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: da
targets:
  MCApp:
    type: application
    platform: iOS
    sources:
      - path: MCApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.schmidtdk73.mcapp
        PRODUCT_NAME: MCApp
        INFOPLIST_FILE: MCApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
